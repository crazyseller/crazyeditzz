<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRAZY CUT Video Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #03030c;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(0, 240, 255, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(255, 0, 127, 0.08) 0%, transparent 40%);
            color: #ffffff;
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Password Modal Styling */
        #loginOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(3, 3, 12, 0.95);
            backdrop-filter: blur(20px);
            z-index: 99999;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-box {
            background: rgba(10, 10, 25, 0.9);
            border: 1px solid rgba(0, 240, 255, 0.4);
            box-shadow: 0 0 35px rgba(0, 240, 255, 0.3);
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 360px;
            text-align: center;
        }

        .login-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #00f0ff, #ff007f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .login-subtitle {
            font-size: 0.9rem;
            color: #8888aa;
            margin-bottom: 20px;
        }

        .password-input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(20, 20, 45, 0.8);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 8px;
            color: #ffffff;
            font-size: 1.2rem;
            text-align: center;
            letter-spacing: 4px;
            margin-bottom: 15px;
            outline: none;
            transition: all 0.25s ease;
        }

        .password-input:focus {
            border-color: #00f0ff;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #00f0ff, #7000ff);
            border: none;
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
            transition: all 0.25s ease;
        }

        .login-btn:hover {
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.7);
            transform: translateY(-2px);
        }

        .error-msg {
            color: #ff007f;
            font-size: 0.85rem;
            margin-top: 10px;
            display: none;
            font-weight: 700;
        }

        /* App UI Structure */
        #appContent {
            display: none;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background: rgba(8, 8, 20, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0, 240, 255, 0.3);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            z-index: 100;
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.6rem;
            font-weight: 900;
            background: linear-gradient(135deg, #00f0ff, #ff007f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
            letter-spacing: 2px;
        }

        .top-actions {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn-glow {
            background: linear-gradient(135deg, #00f0ff, #7000ff);
            border: none;
            color: #ffffff;
            padding: 10px 20px;
            font-size: 0.95rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-glow:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.7);
        }

        .btn-download {
            background: linear-gradient(135deg, #ff007f, #7000ff);
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
        }

        .btn-download:hover {
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.7);
        }

        .btn-download:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .fps-selector-box {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(10, 10, 25, 0.8);
            border: 1px solid rgba(0, 240, 255, 0.4);
            border-radius: 20px;
            padding: 4px 10px;
        }

        .fps-label {
            font-size: 0.8rem;
            font-weight: 700;
            color: #00f0ff;
        }

        .fps-btn {
            background: transparent;
            border: none;
            color: #888;
            padding: 4px 10px;
            font-size: 0.8rem;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .fps-btn.active {
            background: linear-gradient(135deg, #00f0ff, #7000ff);
            color: #ffffff;
            box-shadow: 0 0 10px #00f0ff;
        }

        input[type="file"] {
            display: none;
        }

        .workspace {
            display: flex;
            flex: 1;
            height: calc(100vh - 65px);
            overflow: hidden;
        }

        .preview-area {
            flex: 1;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 20px;
        }

        .video-container {
            position: relative;
            max-width: 90%;
            max-height: 80%;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.9), 0 0 15px rgba(0, 240, 255, 0.2);
            border: 1px solid rgba(0, 240, 255, 0.3);
        }

        video {
            max-width: 100%;
            max-height: 75vh;
            display: block;
            border-radius: 12px;
        }

        canvas {
            display: none;
        }

        .sidebar {
            width: 380px;
            background: rgba(10, 10, 25, 0.95);
            backdrop-filter: blur(15px);
            border-left: 1px solid rgba(0, 240, 255, 0.2);
            display: flex;
            flex-direction: column;
        }

        .tabs {
            display: flex;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .tab-btn {
            flex: 1;
            padding: 14px;
            background: transparent;
            border: none;
            color: #8888aa;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            text-align: center;
        }

        .tab-btn.active {
            color: #00f0ff;
            border-bottom: 3px solid #00f0ff;
            background: rgba(0, 240, 255, 0.05);
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }

        .tab-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .grid-presets {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .btn-option {
            background: rgba(20, 20, 45, 0.7);
            border: 1px solid rgba(0, 240, 255, 0.2);
            color: #fff;
            padding: 12px 8px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 700;
            transition: all 0.2s ease;
            text-align: center;
        }

        .btn-option:hover {
            border-color: #00f0ff;
            background: rgba(0, 240, 255, 0.15);
            transform: scale(1.02);
        }

        .btn-option.active {
            background: linear-gradient(135deg, #00f0ff, #7000ff);
            border-color: #00f0ff;
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.5);
        }

        .export-progress-box {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(5, 5, 18, 0.95);
            border: 1px solid #00f0ff;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.5);
            border-radius: 12px;
            padding: 16px 24px;
            width: 320px;
            text-align: center;
            display: none;
            z-index: 200;
        }

        .export-progress-box.active {
            display: block;
        }

        .progress-bar-container {
            width: 100%;
            height: 8px;
            background: #111;
            border-radius: 4px;
            margin-top: 10px;
            overflow: hidden;
            border: 1px solid rgba(0, 240, 255, 0.3);
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00f0ff, #ff007f);
            transition: width 0.1s linear;
        }

        .status-text {
            font-size: 0.85rem;
            color: #00f0ff;
            font-weight: 700;
        }

        @media (max-width: 850px) {
            .workspace {
                flex-direction: column;
                height: auto;
            }
            .sidebar {
                width: 100%;
                height: 400px;
            }
        }
    </style>
</head>
<body>

    <div id="loginOverlay">
        <div class="login-box">
            <div class="login-title">⚡ CRAZY CUT</div>
            <div class="login-subtitle">Enter password to access studio</div>
            <input type="password" id="passInput" class="password-input" placeholder="****" onkeydown="if(event.key==='Enter') checkPassword()">
            <button class="login-btn" onclick="checkPassword()">UNLOCK STUDIO</button>
            <div class="error-msg" id="errorMsg">❌ Invalid Password! Try Again.</div>
        </div>
    </div>

    <div id="appContent">
        <header>
            <div class="logo">⚡ CRAZY CUT</div>
            
            <div class="top-actions">
                <label for="videoInput" class="btn-glow">📁 Upload Video</label>
                <input type="file" id="videoInput" accept="video/*">

                <div class="fps-selector-box">
                    <span class="fps-label">⚡ FPS:</span>
                    <button class="fps-btn" id="fps30Btn" onclick="selectFps(30)">30 FPS</button>
                    <button class="fps-btn active" id="fps60Btn" onclick="selectFps(60)">60 FPS</button>
                </div>

                <button class="btn-glow btn-download" id="downloadBtn" onclick="downloadEditedVideo()">💾 Export Video</button>
            </div>
        </header>

        <div class="workspace">
            <div class="preview-area">
                <div class="video-container">
                    <video id="videoPlayer" controls playsinline crossorigin="anonymous"></video>
                </div>
                
                <canvas id="exportCanvas"></canvas>

                <div class="export-progress-box" id="exportProgressBox">
                    <div class="status-text" id="exportStatusText">🎬 Initializing Render...</div>
                    <div class="progress-bar-container">
                        <div class="progress-bar" id="exportProgressBar"></div>
                    </div>
                    <div style="font-size:0.75rem; color:#aaa; margin-top:6px;" id="exportPercentage">0%</div>
                </div>
            </div>

            <div class="sidebar">
                <div class="tabs">
                    <button class="tab-btn active" onclick="switchTab('ccTab', this)">50+ CC 🎨</button>
                    <button class="tab-btn" onclick="switchTab('fxTab', this)">Trending 🔥</button>
                </div>

                <div id="ccTab" class="tab-content active">
                    <div class="grid-presets" id="ccPresetsContainer">
                        <button class="btn-option active" onclick="setCC('none', this)">Normal (No CC)</button>
                        <button class="btn-option" onclick="setCC('cc1', this)">CC 1 Auto Glow</button>
                        <button class="btn-option" onclick="setCC('cc2', this)">CC 2 Neon Cyber</button>
                        <button class="btn-option" onclick="setCC('cc3', this)">CC 3 Dark Knight</button>
                        <button class="btn-option" onclick="setCC('cc4', this)">CC 4 HDR Ultra</button>
                        <button class="btn-option" onclick="setCC('cc5', this)">CC 5 Vintage Film</button>
                        <button class="btn-option" onclick="setCC('cc6', this)">CC 6 Red Passion</button>
                        <button class="btn-option" onclick="setCC('cc7', this)">CC 7 Blue Aura</button>
                        <button class="btn-option" onclick="setCC('cc8', this)">CC 8 Anime Soft</button>
                        <button class="btn-option" onclick="setCC('cc9', this)">CC 9 Vivid Punch</button>
                        <button class="btn-option" onclick="setCC('cc10', this)">CC 10 Deep Shadow</button>
                        <button class="btn-option" onclick="setCC('cc11', this)">CC 11 Cinema Gold</button>
                        <button class="btn-option" onclick="setCC('cc12', this)">CC 12 Cold Chill</button>
                        <button class="btn-option" onclick="setCC('cc13', this)">CC 13 Warm Sunset</button>
                        <button class="btn-option" onclick="setCC('cc14', this)">CC 14 Soft Pastel</button>
                        <button class="btn-option" onclick="setCC('cc15', this)">CC 15 Matrix Green</button>
                        <button class="btn-option" onclick="setCC('cc16', this)">CC 16 High Sharp</button>
                        <button class="btn-option" onclick="setCC('cc17', this)">CC 17 Cyber Violet</button>
                        <button class="btn-option" onclick="setCC('cc18', this)">CC 18 B&W Drama</button>
                        <button class="btn-option" onclick="setCC('cc19', this)">CC 19 Sepia Retro</button>
                        <button class="btn-option" onclick="setCC('cc20', this)">CC 20 Sunlight</button>
                    </div>
                </div>

                <div id="fxTab" class="tab-content">
                    <div class="grid-presets">
                        <button class="btn-option" onclick="setCC('fxShake', this)">⚡ Shake FX</button>
                        <button class="btn-option" onclick="setCC('fxGlitch', this)">👾 RGB Glitch</button>
                        <button class="btn-option" onclick="setCC('fxFlash', this)">💥 White Flash</button>
                        <button class="btn-option" onclick="setCC('fxBlur', this)">🌀 Halo Blur</button>
                        <button class="btn-option" onclick="setCC('fxNeon', this)">💡 Neon Edge</button>
                        <button class="btn-option" onclick="setCC('fxVhs', this)">📹 Retro VHS</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Password logic
        function checkPassword() {
            const input = document.getElementById('passInput').value;
            const errorMsg = document.getElementById('errorMsg');
            
            if (input === '400') {
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('appContent').style.display = 'flex';
                // Save session in browser
                sessionStorage.setItem('crazy_auth', 'true');
            } else {
                errorMsg.style.display = 'block';
                document.getElementById('passInput').value = '';
            }
        }

        // Auto-unlock if session active
        if (sessionStorage.getItem('crazy_auth') === 'true') {
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('appContent').style.display = 'flex';
        }

        const videoPlayer = document.getElementById('videoPlayer');
        const videoInput = document.getElementById('videoInput');
        let currentFilter = 'none';
        let selectedFps = 60;

        function selectFps(fps) {
            selectedFps = fps;
            document.getElementById('fps30Btn').classList.toggle('active', fps === 30);
            document.getElementById('fps60Btn').classList.toggle('active', fps === 60);
        }

        videoInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const url = URL.createObjectURL(file);
                videoPlayer.src = url;
                videoPlayer.play();
            }
        });

        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        const ccFilters = {
            'none': 'none',
            'cc1': 'contrast(130%) brightness(110%) saturate(140%)',
            'cc2': 'contrast(150%) hue-rotate(180deg) saturate(180%)',
            'cc3': 'contrast(170%) brightness(80%) saturate(90%)',
            'cc4': 'contrast(160%) brightness(105%) saturate(160%)',
            'cc5': 'sepia(40%) contrast(120%) brightness(90%)',
            'cc6': 'hue-rotate(320deg) saturate(200%) contrast(120%)',
            'cc7': 'hue-rotate(190deg) saturate(160%) brightness(105%)',
            'cc8': 'brightness(115%) saturate(130%) contrast(95%)',
            'cc9': 'contrast(140%) saturate(220%)',
            'cc10': 'brightness(75%) contrast(180%)',
            'cc11': 'sepia(25%) contrast(135%) brightness(105%)',
            'cc12': 'hue-rotate(160deg) contrast(110%)',
            'cc13': 'sepia(30%) hue-rotate(340deg) saturate(150%)',
            'cc14': 'brightness(110%) saturate(80%) contrast(90%)',
            'cc15': 'hue-rotate(90deg) saturate(170%) contrast(130%)',
            'cc16': 'contrast(200%) saturate(110%)',
            'cc17': 'hue-rotate(270deg) saturate(190%) contrast(130%)',
            'cc18': 'grayscale(100%) contrast(160%)',
            'cc19': 'sepia(80%) contrast(110%)',
            'cc20': 'brightness(125%) saturate(130%) hue-rotate(10deg)',
            'fxShake': 'contrast(140%) saturate(150%)',
            'fxGlitch': 'hue-rotate(90deg) invert(20%) contrast(150%)',
            'fxFlash': 'brightness(180%) contrast(150%)',
            'fxBlur': 'blur(3px) brightness(110%)',
            'fxNeon': 'invert(100%) hue-rotate(180deg)',
            'fxVhs': 'sepia(50%) hue-rotate(200%) contrast(120%)'
        };

        // Populate CC 21 to 55 safely
        document.addEventListener('DOMContentLoaded', () => {
            const ccContainer = document.getElementById('ccPresetsContainer');
            if (ccContainer) {
                for (let i = 21; i <= 55; i++) {
                    const filterFormula = `contrast(${100 + (i % 8) * 10}%) brightness(${90 + (i % 5) * 5}%) saturate(${110 + (i % 10) * 10}%) hue-rotate(${(i * 12) % 360}deg)`;
                    ccFilters[`cc${i}`] = filterFormula;

                    const btn = document.createElement('button');
                    btn.className = 'btn-option';
                    btn.innerText = `CC ${i} Pro`;
                    btn.onclick = function() { setCC(`cc${i}`, this); };
                    ccContainer.appendChild(btn);
                }
            }
        });

        function setCC(presetKey, btn) {
            currentFilter = ccFilters[presetKey] || 'none';
            videoPlayer.style.filter = currentFilter;
            
            document.querySelectorAll('.btn-option').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
        }

        function getSupportedMimeType() {
            const types = [
                'video/webm;codecs=vp9',
                'video/webm;codecs=vp8',
                'video/webm',
                'video/mp4'
            ];
            for (let type of types) {
                if (MediaRecorder.isTypeSupported(type)) return type;
            }
            return '';
        }

        async function downloadEditedVideo() {
            if (!videoPlayer.src || videoPlayer.readyState < 2) {
                alert("Please upload a video first!");
                return;
            }

            const downloadBtn = document.getElementById('downloadBtn');
            const progressBox = document.getElementById('exportProgressBox');
            const statusText = document.getElementById('exportStatusText');
            const percentageText = document.getElementById('exportPercentage');
            const progressBar = document.getElementById('exportProgressBar');

            downloadBtn.disabled = true;
            progressBox.classList.add('active');
            progressBar.style.width = '0%';
            percentageText.innerText = '0%';
            statusText.innerText = `🎬 Exporting ${selectedFps} FPS Video...`;

            const canvas = document.getElementById('exportCanvas');
            const ctx = canvas.getContext('2d');

            canvas.width = videoPlayer.videoWidth || 1280;
            canvas.height = videoPlayer.videoHeight || 720;

            const stream = canvas.captureStream(selectedFps);
            const mimeType = getSupportedMimeType();

            let mediaRecorder;
            try {
                mediaRecorder = new MediaRecorder(stream, {
                    mimeType: mimeType || undefined,
                    videoBitsPerSecond: selectedFps === 60 ? 6000000 : 3500000
                });
            } catch (err) {
                mediaRecorder = new MediaRecorder(stream);
            }

            const chunks = [];
            mediaRecorder.ondataavailable = e => {
                if (e.data && e.data.size > 0) chunks.push(e.data);
            };

            mediaRecorder.onstop = () => {
                const blob = new Blob(chunks, { type: mimeType || 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `CRAZY_CUT_${selectedFps}FPS.webm`;
                a.click();

                downloadBtn.disabled = false;
                progressBox.classList.remove('active');
                videoPlayer.play();
            };

            // Reset video to start
            videoPlayer.pause();
            videoPlayer.currentTime = 0;
            await new Promise(r => setTimeout(r, 200));

            const duration = videoPlayer.duration || 1;
            mediaRecorder.start(100);
            videoPlayer.play();

            function renderLoop() {
                if (videoPlayer.ended || videoPlayer.currentTime >= duration) {
                    statusText.innerText = "⚡ Saving File...";
                    progressBar.style.width = '100%';
                    percentageText.innerText = '100%';
                    setTimeout(() => {
                        if (mediaRecorder.state !== 'inactive') mediaRecorder.stop();
                    }, 200);
                    return;
                }

                ctx.filter = currentFilter !== 'none' ? currentFilter : 'none';
                ctx.drawImage(videoPlayer, 0, 0, canvas.width, canvas.height);

                const progress = Math.min(100, Math.floor((videoPlayer.currentTime / duration) * 100));
                progressBar.style.width = `${progress}%`;
                percentageText.innerText = `${progress}%`;

                requestAnimationFrame(renderLoop);
            }

            requestAnimationFrame(renderLoop);
        }
    </script>
</body>
</html>
